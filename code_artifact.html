<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>駐屯人数計算機 - Whiteout Survival</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            shield: '#3b82f6',
            lancer: '#c084fc',
            marksman: '#f472b6',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar and input spin button tweak */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen py-8 px-3 sm:px-6 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Main Container -->
  <div class="max-w-md mx-auto w-full space-y-6">
    
    <!-- Header -->
    <header class="text-center space-y-1.5">
      <h1 class="text-3xl sm:text-4xl font-black tracking-tight bg-gradient-to-r from-purple-300 via-pink-300 to-indigo-300 bg-clip-text text-transparent drop-shadow-sm">
        駐屯人数計算機
      </h1>
      <p class="text-xs text-indigo-300/70 font-medium">本部・砦・ギルド要塞の集結・駐屯用最適化計算</p>
    </header>

    <!-- App Card -->
    <main class="bg-[#111827]/90 border border-slate-800/90 rounded-3xl shadow-2xl p-5 sm:p-6 space-y-6 backdrop-blur-md">
      
      <!-- Input Section 1: Box Capacity & Participants -->
      <section class="space-y-4">
        <!-- 箱の大きさ (Capacity) -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label for="capacity" class="text-sm font-bold text-slate-200 flex items-center gap-2">
              <i class="fa-solid fa-box-archive text-indigo-400"></i>
              箱の大きさ (最大駐屯容量)
            </label>
            <button type="button" onclick="clearInput('capacity')" class="text-xs text-slate-400 hover:text-pink-400 transition-colors font-medium">✕ クリア</button>
          </div>
          <div class="relative">
            <input type="number" id="capacity" placeholder="例: 1347500"
              class="w-full bg-[#0b0f19] border border-slate-700/70 rounded-2xl px-4 py-3.5 text-xl font-bold text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-bold text-slate-500 pointer-events-none">
              名
            </div>
          </div>
          <!-- Quick Capacity Modifiers -->
          <div class="flex gap-2 mt-2.5 overflow-x-auto pb-1 scrollbar-none">
            <button type="button" onclick="addCapacity(50000)" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-semibold py-1.5 px-3 rounded-xl border border-slate-700/60 active:scale-95 transition-all">+5万</button>
            <button type="button" onclick="addCapacity(100000)" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-semibold py-1.5 px-3 rounded-xl border border-slate-700/60 active:scale-95 transition-all">+10万</button>
            <button type="button" onclick="addCapacity(500000)" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-semibold py-1.5 px-3 rounded-xl border border-slate-700/60 active:scale-95 transition-all">+50万</button>
            <button type="button" onclick="setCapacity(2000000)" class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-semibold py-1.5 px-3 rounded-xl border border-slate-700/60 active:scale-95 transition-all">2M</button>
          </div>
        </div>

        <!-- 参加人数 (Participants) -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label for="participants" class="text-sm font-bold text-slate-200 flex items-center gap-2">
              <i class="fa-solid fa-users text-indigo-400"></i>
              <span id="participantsLabel">参加メンバー人数 (箱主含む)</span>
            </label>
            <span id="participantsCountDisplay" class="text-xs font-bold text-indigo-300 bg-indigo-500/20 border border-indigo-500/30 px-2.5 py-0.5 rounded-full">7人</span>
          </div>
          <div class="flex items-center gap-2.5">
            <button type="button" onclick="adjustParticipants(-1)" class="w-12 h-12 bg-slate-800/90 hover:bg-slate-700 border border-slate-700 active:scale-95 rounded-2xl text-xl font-bold text-slate-200 transition-all flex items-center justify-center shadow-md">
              <i class="fa-solid fa-minus"></i>
            </button>
            <input type="number" id="participants" value="7" min="1" max="100"
              class="w-full bg-[#0b0f19] border border-slate-700/70 rounded-2xl py-3 text-center text-2xl font-black text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
            <button type="button" onclick="adjustParticipants(1)" class="w-12 h-12 bg-slate-800/90 hover:bg-slate-700 border border-slate-700 active:scale-95 rounded-2xl text-xl font-bold text-slate-200 transition-all flex items-center justify-center shadow-md">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>

        <!-- 箱主（リーダー）個別設定 (Gold Accent) -->
        <div class="bg-amber-950/20 border border-amber-500/40 rounded-2xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-crown text-amber-400 text-base"></i>
              <span class="text-sm font-bold text-amber-100">箱主（リーダー）の1行軍</span>
            </div>
            <div class="flex items-center gap-2">
              <button type="button" onclick="clearInput('leaderTroops')" class="text-xs text-amber-400/80 hover:text-amber-200 transition-colors font-medium">✕ クリア</button>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="leaderToggle" class="sr-only peer">
                <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
                <span id="leaderToggleText" class="ml-2 text-xs font-bold text-slate-400">OFF</span>
              </label>
            </div>
          </div>
          
          <div id="leaderInputContainer" class="space-y-2 hidden">
            <div class="relative">
              <input type="number" id="leaderTroops" placeholder="例: 200000"
                class="w-full bg-[#0b0f19] border border-amber-500/40 rounded-xl px-4 py-3 text-lg font-bold text-amber-300 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all">
              <div class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-bold text-amber-500/60 pointer-events-none">
                名
              </div>
            </div>
            <p class="text-[11px] text-amber-200/60 font-medium">※ 全体容量から箱主分を差し引いた残りを他メンバーで分割します。</p>
          </div>
        </div>
      </section>

      <hr class="border-slate-800/80">

      <!-- Input Section 2: Troop Ratios -->
      <section class="space-y-3">
        <div class="flex justify-between items-center">
          <label class="text-sm font-bold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-indigo-400"></i>
            他メンバーの兵士割合 (%)
          </label>
          <div class="flex items-center gap-2">
            <button type="button" onclick="clearRatios()" class="text-xs text-slate-400 hover:text-pink-400 transition-colors font-medium">✕ クリア</button>
            <span id="totalRatioBadge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
              合計: 100%
            </span>
          </div>
        </div>

        <!-- Preset Buttons -->
        <div class="grid grid-cols-5 gap-1.5">
          <button type="button" onclick="setRatio(40, 10, 50)" class="text-xs bg-slate-800/80 hover:bg-indigo-600 text-slate-200 py-2 px-1 rounded-xl border border-slate-700/60 font-bold transition-all text-center active:scale-95">
            4:1:5
          </button>
          <button type="button" onclick="setRatio(50, 0, 50)" class="text-xs bg-slate-800/80 hover:bg-indigo-600 text-slate-200 py-2 px-1 rounded-xl border border-slate-700/60 font-bold transition-all text-center active:scale-95">
            5:0:5
          </button>
          <button type="button" onclick="setRatio(0, 0, 100)" class="text-xs bg-slate-800/80 hover:bg-indigo-600 text-slate-200 py-2 px-1 rounded-xl border border-slate-700/60 font-bold transition-all text-center active:scale-95">
            100% 弓
          </button>
          <button type="button" onclick="setRatio(100, 0, 0)" class="text-xs bg-slate-800/80 hover:bg-indigo-600 text-slate-200 py-2 px-1 rounded-xl border border-slate-700/60 font-bold transition-all text-center active:scale-95">
            100% 盾
          </button>
          <button type="button" onclick="setRatio(33, 33, 34)" class="text-xs bg-slate-800/80 hover:bg-indigo-600 text-slate-200 py-2 px-1 rounded-xl border border-slate-700/60 font-bold transition-all text-center active:scale-95">
            均等
          </button>
        </div>

        <!-- 3 Ratio Inputs -->
        <div class="grid grid-cols-3 gap-2 pt-1">
          <!-- 盾 (Shield) -->
          <div class="bg-[#0b0f19] p-3 rounded-2xl border border-slate-800 focus-within:border-shield transition-colors text-center">
            <div class="flex items-center justify-center gap-1 text-xs font-bold text-shield mb-1">
              <i class="fa-solid fa-shield-halved"></i>
              <span>盾 (%)</span>
            </div>
            <input type="number" id="ratioShield" placeholder="0" min="0" max="100"
              class="w-full bg-transparent text-xl font-black text-white focus:outline-none text-center placeholder-slate-600">
          </div>
          <!-- 槍 (Lancer) -->
          <div class="bg-[#0b0f19] p-3 rounded-2xl border border-slate-800 focus-within:border-lancer transition-colors text-center">
            <div class="flex items-center justify-center gap-1 text-xs font-bold text-lancer mb-1">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span>槍 (%)</span>
            </div>
            <input type="number" id="ratioLancer" placeholder="0" min="0" max="100"
              class="w-full bg-transparent text-xl font-black text-white focus:outline-none text-center placeholder-slate-600">
          </div>
          <!-- 弓 (Marksman) -->
          <div class="bg-[#0b0f19] p-3 rounded-2xl border border-slate-800 focus-within:border-marksman transition-colors text-center">
            <div class="flex items-center justify-center gap-1 text-xs font-bold text-marksman mb-1">
              <i class="fa-solid fa-crosshair"></i>
              <span>弓 (%)</span>
            </div>
            <input type="number" id="ratioMarksman" placeholder="0" min="0" max="100"
              class="w-full bg-transparent text-xl font-black text-white focus:outline-none text-center placeholder-slate-600">
          </div>
        </div>
      </section>

      <!-- Input Section 3: Rough Calculation Toggle & Rounding Unit -->
      <section class="bg-[#0b0f19]/80 p-4 rounded-2xl border border-slate-800 space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-magnifying-glass text-indigo-400"></i>
            <span class="text-sm font-bold text-slate-200">ざっくり計算 (端数切捨て)</span>
          </div>
          <!-- Toggle Switch -->
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="roughToggle" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            <span id="toggleText" class="ml-2 text-xs font-bold text-indigo-400">ON</span>
          </label>
        </div>

        <!-- Rounding Unit Selectors -->
        <div id="roundingUnitContainer" class="grid grid-cols-3 gap-2 transition-opacity duration-200">
          <button type="button" onclick="setRoundingUnit(100)" id="unit100"
            class="py-2 text-xs font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400 hover:text-white transition-all text-center">
            100の位
          </button>
          <button type="button" onclick="setRoundingUnit(1000)" id="unit1000"
            class="py-2 text-xs font-bold rounded-xl border border-indigo-500 bg-indigo-500/20 text-indigo-300 transition-all text-center">
            1000の位
          </button>
          <button type="button" onclick="setRoundingUnit(10000)" id="unit10000"
            class="py-2 text-xs font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400 hover:text-white transition-all text-center">
            10000の位
          </button>
        </div>
      </section>

      <!-- Action Buttons -->
      <div class="grid grid-cols-4 gap-2.5">
        <button type="button" onclick="calculate()" 
          class="col-span-3 py-4 px-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-black text-lg rounded-2xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
          <i class="fa-solid fa-calculator"></i>
          <span>計算する！</span>
        </button>
        <button type="button" onclick="clearAll()" 
          class="col-span-1 py-4 px-2 bg-slate-800/80 hover:bg-rose-950/50 text-rose-400 border border-slate-700 hover:border-rose-800 font-bold text-xs rounded-2xl active:scale-95 transition-all flex flex-col items-center justify-center gap-1">
          <i class="fa-solid fa-trash-can text-sm"></i>
          <span>全クリア</span>
        </button>
      </div>

      <!-- RESULTS SECTION -->
      <section class="space-y-4 pt-2 border-t border-slate-800">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-extrabold text-slate-100 flex items-center gap-2">
            <i class="fa-solid fa-square-poll-vertical text-indigo-400"></i>
            計算結果
          </h2>
          <span class="text-xs text-slate-400 font-medium">1人当たりの兵士数</span>
        </div>

        <!-- Leader Summary Card (If ON) -->
        <div id="leaderResultCard" class="bg-amber-950/30 border border-amber-500/40 rounded-2xl p-3.5 justify-between items-center hidden">
          <div class="flex items-center gap-2.5">
            <i class="fa-solid fa-crown text-amber-400 text-xl"></i>
            <div>
              <div class="text-xs font-bold text-amber-300">箱主 (リーダー)</div>
              <div class="text-[11px] text-slate-400">1行軍固定</div>
            </div>
          </div>
          <div id="resultLeader" class="text-xl font-black text-amber-400">0</div>
        </div>

        <!-- 3 Troop Cards -->
        <div class="grid grid-cols-3 gap-2">
          <!-- 盾 Result -->
          <div class="bg-[#0b0f19] p-3.5 rounded-2xl border border-slate-800/80 text-center flex flex-col justify-between">
            <span class="text-xs font-bold text-shield flex items-center justify-center gap-1">
              <i class="fa-solid fa-shield-halved"></i> 盾
            </span>
            <span id="resultShield" class="text-xl sm:text-2xl font-black text-blue-400 my-1">0</span>
          </div>
          <!-- 槍 Result -->
          <div class="bg-[#0b0f19] p-3.5 rounded-2xl border border-slate-800/80 text-center flex flex-col justify-between">
            <span class="text-xs font-bold text-lancer flex items-center justify-center gap-1">
              <i class="fa-solid fa-wand-magic-sparkles"></i> 槍
            </span>
            <span id="resultLancer" class="text-xl sm:text-2xl font-black text-purple-400 my-1">0</span>
          </div>
          <!-- 弓 Result -->
          <div class="bg-[#0b0f19] p-3.5 rounded-2xl border border-slate-800/80 text-center flex flex-col justify-between">
            <span class="text-xs font-bold text-marksman flex items-center justify-center gap-1">
              <i class="fa-solid fa-crosshair"></i> 弓
            </span>
            <span id="resultMarksman" class="text-xl sm:text-2xl font-black text-pink-400 my-1">0</span>
          </div>
        </div>

        <!-- Total Troops per member -->
        <div class="bg-indigo-950/40 border border-indigo-500/30 rounded-2xl p-4 text-center">
          <div class="text-xs font-bold text-indigo-300 mb-0.5">1人当たり合計</div>
          <div id="resultTotal" class="text-3xl font-black text-indigo-400">0</div>
        </div>

        <!-- Remaining Capacity (余り) -->
        <div class="bg-[#0b0f19] border border-slate-800 rounded-2xl p-3.5 text-center flex justify-between items-center px-5">
          <span class="text-xs font-bold text-slate-400">余りの兵士数</span>
          <span id="resultRemaining" class="text-lg font-black text-amber-400">0</span>
        </div>

        <!-- Copy to Clipboard Button -->
        <button type="button" onclick="copyResultText()" id="copyBtn"
          class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-2xl shadow-lg shadow-emerald-600/20 active:scale-95 transition-all flex items-center justify-center gap-2">
          <i class="fa-regular fa-copy"></i>
          <span id="copyBtnText">📋 チャット用にコピー</span>
        </button>

      </section>
    </main>

    <!-- Footer -->
    <footer class="text-center text-slate-600 text-xs py-2">
      <p>Whiteout Survival Garrison Calculator</p>
    </footer>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white border border-slate-700 px-5 py-3 rounded-full shadow-2xl text-xs font-bold transition-all duration-300 opacity-0 pointer-events-none flex items-center gap-2">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">クリップボードにコピーしました！</span>
  </div>

  <script>
    let currentRoundingUnit = 1000;
    const STORAGE_KEY = 'wos_garrison_calc_v2';

    // DOM Elements
    const capacityInput = document.getElementById('capacity');
    const participantsInput = document.getElementById('participants');
    const participantsCountDisplay = document.getElementById('participantsCountDisplay');
    const participantsLabel = document.getElementById('participantsLabel');

    const leaderToggle = document.getElementById('leaderToggle');
    const leaderToggleText = document.getElementById('leaderToggleText');
    const leaderInputContainer = document.getElementById('leaderInputContainer');
    const leaderTroopsInput = document.getElementById('leaderTroops');
    const leaderResultCard = document.getElementById('leaderResultCard');
    const resultLeader = document.getElementById('resultLeader');

    const ratioShieldInput = document.getElementById('ratioShield');
    const ratioLancerInput = document.getElementById('ratioLancer');
    const ratioMarksmanInput = document.getElementById('ratioMarksman');
    const totalRatioBadge = document.getElementById('totalRatioBadge');

    const roughToggle = document.getElementById('roughToggle');
    const toggleText = document.getElementById('toggleText');
    const roundingUnitContainer = document.getElementById('roundingUnitContainer');

    const resultShield = document.getElementById('resultShield');
    const resultLancer = document.getElementById('resultLancer');
    const resultMarksman = document.getElementById('resultMarksman');
    const resultTotal = document.getElementById('resultTotal');
    const resultRemaining = document.getElementById('resultRemaining');

    // Init Event Listeners
    const liveInputs = [capacityInput, participantsInput, leaderTroopsInput, ratioShieldInput, ratioLancerInput, ratioMarksmanInput];
    liveInputs.forEach(input => {
      input.addEventListener('input', calculate);
    });

    leaderToggle.addEventListener('change', (e) => {
      toggleLeaderUI(e.target.checked);
      calculate();
    });

    roughToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        toggleText.textContent = "ON";
        toggleText.className = "ml-2 text-xs font-bold text-indigo-400";
        roundingUnitContainer.classList.remove('opacity-30', 'pointer-events-none');
      } else {
        toggleText.textContent = "OFF";
        toggleText.className = "ml-2 text-xs font-bold text-slate-500";
        roundingUnitContainer.classList.add('opacity-30', 'pointer-events-none');
      }
      calculate();
    });

    function toggleLeaderUI(isON) {
      if (isON) {
        leaderToggleText.textContent = "ON";
        leaderToggleText.className = "ml-2 text-xs font-bold text-amber-400";
        leaderInputContainer.classList.remove('hidden');
        leaderResultCard.classList.remove('hidden');
        leaderResultCard.classList.add('flex');
        participantsLabel.textContent = "参加メンバー人数 (箱主含む)";
      } else {
        leaderToggleText.textContent = "OFF";
        leaderToggleText.className = "ml-2 text-xs font-bold text-slate-500";
        leaderInputContainer.classList.add('hidden');
        leaderResultCard.classList.add('hidden');
        leaderResultCard.classList.remove('flex');
        participantsLabel.textContent = "参加メンバー人数";
      }
    }

    // Clear & Modifier helpers
    function clearInput(id) {
      document.getElementById(id).value = '';
      calculate();
    }

    function clearRatios() {
      ratioShieldInput.value = '';
      ratioLancerInput.value = '';
      ratioMarksmanInput.value = '';
      calculate();
    }

    function clearAll() {
      capacityInput.value = '';
      leaderTroopsInput.value = '';
      ratioShieldInput.value = '';
      ratioLancerInput.value = '';
      ratioMarksmanInput.value = '';
      participantsInput.value = 7;
      leaderToggle.checked = false;
      toggleLeaderUI(false);
      calculate();
      saveState();
    }

    function setCapacity(val) {
      capacityInput.value = val;
      calculate();
    }

    function addCapacity(val) {
      const current = parseInt(capacityInput.value) || 0;
      capacityInput.value = current + val;
      calculate();
    }

    function adjustParticipants(delta) {
      let current = parseInt(participantsInput.value) || 1;
      current += delta;
      if (current < 1) current = 1;
      participantsInput.value = current;
      calculate();
    }

    function setRatio(shield, lancer, marksman) {
      ratioShieldInput.value = shield;
      ratioLancerInput.value = lancer;
      ratioMarksmanInput.value = marksman;
      calculate();
    }

    function setRoundingUnit(unit) {
      currentRoundingUnit = unit;
      [100, 1000, 10000].forEach(u => {
        const btn = document.getElementById(`unit${u}`);
        if (u === unit) {
          btn.className = "py-2 text-xs font-bold rounded-xl border border-indigo-500 bg-indigo-500/20 text-indigo-300 transition-all text-center";
        } else {
          btn.className = "py-2 text-xs font-bold rounded-xl border border-slate-700 bg-slate-900 text-slate-400 hover:text-white transition-all text-center";
        }
      });
      calculate();
    }

    // Core Calculation Logic
    function calculate() {
      const cap = Math.max(0, parseInt(capacityInput.value) || 0);
      const totalPeople = Math.max(1, parseInt(participantsInput.value) || 1);
      participantsCountDisplay.textContent = `${totalPeople}人`;

      const isLeaderOn = leaderToggle.checked;
      const leaderTroops = isLeaderOn ? Math.max(0, parseInt(leaderTroopsInput.value) || 0) : 0;
      
      const memberPeople = isLeaderOn ? Math.max(1, totalPeople - 1) : totalPeople;
      const availableCapForMembers = Math.max(0, cap - leaderTroops);

      const rShield = Math.max(0, parseFloat(ratioShieldInput.value) || 0);
      const rLancer = Math.max(0, parseFloat(ratioLancerInput.value) || 0);
      const rMarksman = Math.max(0, parseFloat(ratioMarksmanInput.value) || 0);

      const totalRatio = rShield + rLancer + rMarksman;
      
      totalRatioBadge.textContent = `合計: ${totalRatio}%`;
      if (totalRatio > 0 && Math.abs(totalRatio - 100) > 0.1) {
        totalRatioBadge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30";
      } else {
        totalRatioBadge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
      }

      const capPerMember = availableCapForMembers / memberPeople;

      let sCount = totalRatio > 0 ? capPerMember * (rShield / totalRatio) : 0;
      let lCount = totalRatio > 0 ? capPerMember * (rLancer / totalRatio) : 0;
      let mCount = totalRatio > 0 ? capPerMember * (rMarksman / totalRatio) : 0;

      const isRough = roughToggle.checked;

      if (isRough) {
        const u = currentRoundingUnit;
        sCount = Math.floor(sCount / u) * u;
        lCount = Math.floor(lCount / u) * u;
        mCount = Math.floor(mCount / u) * u;
      } else {
        sCount = Math.floor(sCount);
        lCount = Math.floor(lCount);
        mCount = Math.floor(mCount);
      }

      const totalPerMember = sCount + lCount + mCount;
      const totalMembersGarrisoned = totalPerMember * memberPeople;
      const grandTotalGarrisoned = leaderTroops + totalMembersGarrisoned;
      const remaining = cap - grandTotalGarrisoned;

      // Update UI
      resultLeader.textContent = leaderTroops.toLocaleString();
      resultShield.textContent = sCount.toLocaleString();
      resultLancer.textContent = lCount.toLocaleString();
      resultMarksman.textContent = mCount.toLocaleString();
      resultTotal.textContent = totalPerMember.toLocaleString();
      resultRemaining.textContent = remaining.toLocaleString();

      saveState();
    }

    // Exact requested format copy
    function copyResultText() {
      const totalPeople = participantsCountDisplay.textContent;
      const shield = resultShield.textContent;
      const lancer = resultLancer.textContent;
      const marksman = resultMarksman.textContent;
      const total = resultTotal.textContent;
      const remaining = resultRemaining.textContent;

      const textToCopy = `【駐屯人数】(${totalPeople})\n` +
        `1人当たり合計: ${total}\n` +
        `盾: ${shield}\n` +
        `槍: ${lancer}\n` +
        `弓: ${marksman}\n` +
        `余り: ${remaining}`;

      const tempTextArea = document.createElement("textarea");
      tempTextArea.value = textToCopy;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      
      try {
        document.execCommand('copy');
        showToast("結果をコピーしました！");
      } catch (err) {
        showToast("コピーに失敗しました");
      } finally {
        document.body.removeChild(tempTextArea);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function saveState() {
      const state = {
        capacity: capacityInput.value,
        participants: participantsInput.value,
        leaderTroops: leaderTroopsInput.value,
        leaderToggle: leaderToggle.checked,
        ratioShield: ratioShieldInput.value,
        ratioLancer: ratioLancerInput.value,
        ratioMarksman: ratioMarksmanInput.value,
        roughToggle: roughToggle.checked,
        roundingUnit: currentRoundingUnit
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      try {
        const state = JSON.parse(saved);
        if (state.capacity !== undefined) capacityInput.value = state.capacity;
        if (state.participants !== undefined) participantsInput.value = state.participants;
        if (state.leaderTroops !== undefined) leaderTroopsInput.value = state.leaderTroops;
        if (state.leaderToggle !== undefined) {
          leaderToggle.checked = state.leaderToggle;
          toggleLeaderUI(state.leaderToggle);
        }
        if (state.ratioShield !== undefined) ratioShieldInput.value = state.ratioShield;
        if (state.ratioLancer !== undefined) ratioLancerInput.value = state.ratioLancer;
        if (state.ratioMarksman !== undefined) ratioMarksmanInput.value = state.ratioMarksman;
        if (state.roughToggle !== undefined) roughToggle.checked = state.roughToggle;
        if (state.roundingUnit !== undefined) setRoundingUnit(state.roundingUnit);
      } catch (e) {
        console.error(e);
      }
    }

    window.onload = function() {
      loadState();
      calculate();
    };
  </script>
</body>
</html>
