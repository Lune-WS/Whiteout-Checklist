<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王城戦 差し込み計算機</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 360px;
            border: 1px solid #333;
        }
        h2 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #ffcc00;
        }
        .input-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 4px;
        }
        .time-inputs {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .time-inputs input {
            width: 100%;
            padding: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            text-align: center;
        }
        .time-inputs span {
            font-size: 14px;
            color: #aaa;
            white-space: nowrap;
        }
        input:focus {
            border-color: #ffcc00;
            outline: none;
        }
        .result-box {
            margin-top: 20px;
            background-color: #252525;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid #ffcc00;
        }
        .result-label {
            font-size: 12px;
            color: #ffcc00;
            margin-bottom: 4px;
        }
        .result-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffcc00;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>👑 差し込み計算機</h2>
    
    <div class="input-group">
        <label>⏱️ 敵の集結残り時間</label>
        <div class="time-inputs">
            <input type="number" id="gatherMin" placeholder="0" oninput="calculate()"><span>分</span>
            <input type="number" id="gatherSec" placeholder="0" oninput="calculate()"><span>秒</span>
        </div>
    </div>

    <div class="input-group">
        <label>⚔️ 敵の行軍時間</label>
        <div class="time-inputs">
            <input type="number" id="enemyMin" placeholder="0" oninput="calculate()"><span>分</span>
            <input type="number" id="enemySec" placeholder="0" oninput="calculate()"><span>秒</span>
        </div>
    </div>

    <div class="input-group">
        <label>🛡️ 自分の行軍時間</label>
        <div class="time-inputs">
            <input type="number" id="myMin" placeholder="0" oninput="calculate()"><span>分</span>
            <input type="number" id="mySec" placeholder="0" oninput="calculate()"><span>秒</span>
        </div>
    </div>

    <div class="result-box">
        <div class="result-label">この残り時間になったら発射！</div>
        <span class="result-value" id="result">-</span>
    </div>
</div>

<script>
    function getTimeInSec(minId, secId) {
        const m = parseFloat(document.getElementById(minId).value) || 0;
        const s = parseFloat(document.getElementById(secId).value) || 0;
        return (m * 60) + s;
    }

    function calculate() {
        const gather = getTimeInSec('gatherMin', 'gatherSec');
        const enemyMarch = getTimeInSec('enemyMin', 'enemySec');
        const myMarch = getTimeInSec('myMin', 'mySec');
        
        const resultEl = document.getElementById('result');

        if (!document.getElementById('gatherMin').value && !document.getElementById('gatherSec').value &&
            !document.getElementById('enemyMin').value && !document.getElementById('enemySec').value &&
            !document.getElementById('myMin').value && !document.getElementById('mySec').value) {
            resultEl.style.fontSize = "28px";
            resultEl.innerText = "-";
            return;
        }

        // 正しい計算：
        // 敵の着弾タイミング ＝ 集結残り時間 ＋ 敵の行軍時間
        // 自分が発射すべき集結残り時間 ＝ 敵の着弾タイミング － 自分の行軍時間
        // 変形すると：集結残り ＋ (敵行軍 － 自分行軍) となります。
        
        const diff = enemyMarch - myMarch;
        const myTriggerTime = gather + diff;

        if (myTriggerTime < 0) {
            resultEl.style.fontSize = "14px";
            resultEl.innerText = "⚠️ 行軍が遅すぎて間に合いません";
        } else {
            const m = Math.floor(myTriggerTime / 60);
            const s = myTriggerTime % 60;
            
            resultEl.style.fontSize = "28px";
            if (m > 0) {
                resultEl.innerText = `${m}分 ${s}秒`;
            } else {
                resultEl.innerText = `${s}秒`;
            }
        }
    }
</script>

</body>
</html>
