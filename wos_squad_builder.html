<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ホワサバ 部隊編成シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      background-color: #12161f;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d1017; }
    ::-webkit-scrollbar-thumb { background: #2a6ea6; border-radius: 9999px; }

    .rarity-SSR {
      background: linear-gradient(145deg, #d97706 0%, #92400e 55%, #451a03 100%);
      border-color: #fbbf24;
    }
    .rarity-SR {
      background: linear-gradient(145deg, #7e22ce 0%, #581c87 55%, #2e1065 100%);
      border-color: #c084fc;
    }
    .rarity-R {
      background: linear-gradient(145deg, #1d4ed8 0%, #1e3a8a 55%, #172554 100%);
      border-color: #60a5fa;
    }

    @keyframes pulseBorder {
      0%, 100% { box-shadow: 0 0 0 2px #38bdf8, inset 0 0 10px rgba(56, 189, 248, 0.35); }
      50% { box-shadow: 0 0 0 3px #7dd3fc, inset 0 0 16px rgba(56, 189, 248, 0.55); }
    }
    .slot-active {
      animation: pulseBorder 1.6s infinite;
      border-color: #38bdf8 !important;
      background-color: rgba(30, 58, 138, 0.35) !important;
    }

    .drag-over {
      border-color: #34d399 !important;
      background-color: rgba(16, 185, 129, 0.25) !important;
      transform: scale(1.03);
    }

    .squad-label-box {
      background: linear-gradient(180deg, #2574b5 0%, #1d5d94 100%);
    }

    .squad-row-container {
      border: 1.5px solid #2a6ea6;
      background-color: #161b26;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

  <!-- トースト通知 -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- 上部ツールバー -->
  <header class="sticky top-0 z-30 bg-[#12161f]/95 border-b border-[#2a6ea6]/60 px-2 sm:px-4 py-2 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
      
      <!-- 左側：セット切替・行追加・リセット -->
      <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
        <div class="flex items-center gap-1.5 mr-1">
          <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-[#2574b5] text-white font-black text-sm shadow">❄</span>
          <h1 class="text-sm sm:text-base font-extrabold tracking-tight text-sky-100 hidden md:block">ホワサバ編成</h1>
        </div>

        <div class="flex items-center rounded-lg overflow-hidden border border-[#2a6ea6] bg-[#1a202c]">
          <select id="presetSelect" class="bg-[#1a202c] text-white text-xs sm:text-sm font-bold px-2.5 py-1.5 focus:outline-none cursor-pointer"></select>
          <button id="editPresetNameBtn" title="セット名を編集" class="bg-[#2574b5] hover:bg-[#3b82f6] text-white px-2.5 py-1.5 transition flex items-center justify-center">✏️</button>
        </div>

        <button id="addSquadBtn" class="flex items-center gap-1 bg-[#1e293b] hover:bg-[#2574b5] text-sky-200 hover:text-white border border-[#2a6ea6] rounded-lg px-2.5 py-1.5 text-xs font-bold transition">
          <span>＋</span><span class="hidden sm:inline">行追加</span>
        </button>

        <button id="resetPresetBtn" class="flex items-center gap-1 bg-[#1e293b] hover:bg-rose-700/80 text-slate-300 hover:text-white border border-[#2a6ea6] hover:border-rose-500 rounded-lg px-2.5 py-1.5 text-xs font-bold transition">
          <span>↺</span><span class="hidden sm:inline">リセット</span>
        </button>
      </div>

      <!-- 右側：重複許可・コピー・画像保存・英雄追加・初期英雄復元 -->
      <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
        <label class="flex items-center gap-1.5 bg-[#1a202c] border border-[#2a6ea6]/80 rounded-lg px-2.5 py-1.5 cursor-pointer text-xs font-semibold text-slate-200 hover:border-sky-400 transition">
          <input type="checkbox" id="allowDuplicateToggle" class="accent-[#2574b5]" />
          <span>重複許可</span>
        </label>

        <button id="copyTextBtn" class="flex items-center gap-1 bg-[#1e293b] hover:bg-[#2574b5] text-sky-200 hover:text-white border border-[#2a6ea6] rounded-lg px-2.5 py-1.5 text-xs font-bold transition">
          <span>📋</span><span class="hidden sm:inline">コピー</span>
        </button>

        <button id="saveImageBtn" class="flex items-center gap-1 bg-[#2574b5] hover:bg-[#3b82f6] text-white rounded-lg px-2.5 py-1.5 text-xs font-bold shadow transition">
          <span>🖼️</span><span class="hidden sm:inline">画像保存</span>
        </button>

        <button id="openCustomHeroModalBtn" class="flex items-center gap-1 bg-amber-600/90 hover:bg-amber-500 text-white rounded-lg px-2.5 py-1.5 text-xs font-bold shadow transition">
          <span>＋</span><span class="hidden sm:inline">英雄追加</span>
        </button>

        <button id="restoreHeroesBtn" title="削除した初期英雄をリストに復元" class="hidden items-center gap-1 bg-[#1e293b] hover:bg-emerald-700/80 text-emerald-300 hover:text-white border border-emerald-600/60 rounded-lg px-2.5 py-1.5 text-xs font-bold transition">
          <span>🔄</span><span class="hidden md:inline">初期英雄復元</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ（PCでは左右2カラム、スマホでは上下レイアウト） -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto px-2 sm:px-4 py-3 flex flex-col gap-3">

    <!-- 操作ガイドバー -->
    <div class="flex flex-wrap items-center justify-between gap-2 text-[11px] sm:text-xs text-slate-400 bg-[#161b26] border border-[#2a6ea6]/40 rounded-lg px-3 py-1.5">
      <div>
        <span class="text-sky-400 font-bold">💡 操作:</span>
        <span>空き枠タップで英雄を選択。各キャラ右上の「✏️」から写真設定・名前変更・個別削除ができます。</span>
      </div>
      <div id="activeSlotIndicator" class="text-sky-300 font-bold hidden sm:block">選択中: なし</div>
    </div>

    <div class="flex-1 flex flex-col lg:flex-row items-start gap-3">
      <!-- ① 左側（スマホでは上）：メイン編成エリア -->
      <section id="captureArea" class="w-full lg:w-[54%] xl:w-[52%] shrink-0 bg-[#12161f] rounded-xl p-1 sm:p-2">
        <div class="flex items-center justify-between mb-1.5 px-1">
          <span id="captureTitle" class="text-xs font-bold text-sky-300 tracking-wide">セット1</span>
          <span class="text-[10px] text-slate-500">Whiteout Survival Squad Builder</span>
        </div>

        <!-- 出征上限・ペット・ダイヤバフ設定バー -->
        <div class="bg-[#161b26] border border-[#2a6ea6]/70 rounded-lg p-2 mb-2 flex flex-wrap items-center justify-between gap-2 text-xs">
          <div class="flex items-center gap-1.5">
            <span class="text-sky-300 font-bold">⚔️ 基礎出征上限:</span>
            <input type="number" id="baseCapacityInput" min="0" step="1000" placeholder="150000" class="w-24 sm:w-28 bg-[#12161f] border border-[#2a6ea6] rounded px-2 py-1 text-white font-bold text-right focus:outline-none focus:border-sky-400" />
            <span class="text-slate-400 text-[11px]">人</span>
          </div>

          <div class="flex items-center gap-1.5 flex-wrap">
            <div class="flex items-center bg-[#12161f] border border-[#2a6ea6] rounded overflow-hidden">
              <span class="text-[11px] font-bold text-amber-300 pl-2 pr-1">💎 ダイヤ:</span>
              <select id="gemBuffSelect" class="bg-[#12161f] text-white text-xs font-bold pr-2 py-1 focus:outline-none cursor-pointer">
                <option value="0">なし (0%)</option>
                <option value="10">+10%</option>
                <option value="20">+20%</option>
              </select>
            </div>

            <div class="flex items-center bg-[#12161f] border border-[#2a6ea6] rounded overflow-hidden">
              <span class="text-[11px] font-bold text-emerald-300 pl-2 pr-1">🐾 ペット:</span>
              <input type="number" id="petBuffInput" min="0" max="100" step="1" placeholder="0" class="w-12 bg-[#12161f] text-white text-xs font-bold text-right py-1 focus:outline-none" />
              <span class="text-slate-400 text-[11px] pr-2">%</span>
            </div>

            <div id="effectiveCapacityBadge" class="bg-[#2574b5]/30 border border-sky-400/50 text-sky-200 font-extrabold px-2 py-1 rounded text-[11px]">
              実出征: 150,000人
            </div>
          </div>

          <!-- 手持ち総兵数＆全軍合計・過不足チェッカー -->
          <div class="w-full pt-2 mt-0.5 border-t border-[#2a6ea6]/40 flex flex-wrap items-center justify-between gap-2 text-[11px]">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-slate-300 font-bold">📦 手持ち総数:</span>
              <label class="flex items-center gap-1 bg-[#12161f] border border-[#2a6ea6]/60 rounded px-1.5 py-0.5">
                <span class="text-sky-300 font-bold">🛡️</span>
                <input type="number" id="totalShieldInput" min="0" step="1000" placeholder="0" class="w-20 bg-transparent text-white font-bold text-right focus:outline-none" />
              </label>
              <label class="flex items-center gap-1 bg-[#12161f] border border-[#2a6ea6]/60 rounded px-1.5 py-0.5">
                <span class="text-emerald-300 font-bold">🔱</span>
                <input type="number" id="totalSpearInput" min="0" step="1000" placeholder="0" class="w-20 bg-transparent text-white font-bold text-right focus:outline-none" />
              </label>
              <label class="flex items-center gap-1 bg-[#12161f] border border-[#2a6ea6]/60 rounded px-1.5 py-0.5">
                <span class="text-amber-300 font-bold">🏹</span>
                <input type="number" id="totalBowInput" min="0" step="1000" placeholder="0" class="w-20 bg-transparent text-white font-bold text-right focus:outline-none" />
              </label>
            </div>
            <div id="troopBalanceSummary" class="flex items-center gap-2 flex-wrap font-bold"></div>
          </div>
        </div>

        <div id="squadsContainer" class="flex flex-col gap-2"></div>
      </section>

      <!-- ② 右側（スマホでは下）：フィルター＆英雄プールエリア -->
      <div class="w-full lg:flex-1 flex flex-col gap-2.5 lg:sticky lg:top-[56px] lg:max-h-[calc(100vh-72px)]">
        <!-- フィルター＆世代上限バー -->
        <section class="bg-[#161b26] border border-[#2a6ea6]/70 rounded-xl p-2.5 shadow-md shrink-0">
          <div class="flex flex-wrap items-center justify-between gap-2">
            
            <!-- 兵種フィルター -->
            <div class="flex items-center gap-1 flex-wrap">
              <button data-type="ALL" class="filter-type-btn active bg-[#2574b5] text-white px-2.5 py-1 rounded-lg text-xs font-bold transition">全兵種</button>
              <button data-type="shield" class="filter-type-btn bg-[#1e293b] hover:bg-[#2a6ea6]/50 text-slate-300 px-2.5 py-1 rounded-lg text-xs font-bold transition">🛡️ 盾兵</button>
              <button data-type="spear" class="filter-type-btn bg-[#1e293b] hover:bg-[#2a6ea6]/50 text-slate-300 px-2.5 py-1 rounded-lg text-xs font-bold transition">🔱 槍兵</button>
              <button data-type="bow" class="filter-type-btn bg-[#1e293b] hover:bg-[#2a6ea6]/50 text-slate-300 px-2.5 py-1 rounded-lg text-xs font-bold transition">🏹 弓兵</button>
            </div>

            <!-- 世代上限・検索 -->
            <div class="flex items-center gap-1.5 flex-wrap flex-1 sm:flex-initial justify-end">
              <div class="flex items-center bg-[#1e293b] border border-sky-500/50 rounded-lg overflow-hidden">
                <span class="text-[10px] font-bold text-sky-300 pl-2 pr-1">上限:</span>
                <select id="maxGenFilter" class="bg-[#1e293b] text-white text-xs font-bold pr-2 py-1.5 focus:outline-none cursor-pointer">
                  <option value="9">G9まで</option>
                  <option value="8">G8まで</option>
                  <option value="7" selected>G7まで</option>
                  <option value="6">G6まで</option>
                  <option value="5">G5まで</option>
                  <option value="4">G4まで</option>
                  <option value="3">G3まで</option>
                  <option value="2">G2まで</option>
                  <option value="1">G1のみ</option>
                </select>
              </div>

              <select id="genFilter" class="bg-[#1e293b] border border-[#2a6ea6]/60 text-slate-200 text-xs font-bold rounded-lg px-2 py-1.5 focus:outline-none">
                <option value="ALL">全世代</option>
                <option value="G1">G1</option>
                <option value="G2">G2</option>
                <option value="G3">G3</option>
                <option value="G4">G4</option>
                <option value="G5">G5</option>
                <option value="G6">G6</option>
                <option value="G7">G7</option>
                <option value="G8">G8</option>
                <option value="G9">G9</option>
                <option value="CUSTOM">カスタム</option>
              </select>

              <select id="rarityFilter" class="bg-[#1e293b] border border-[#2a6ea6]/60 text-slate-200 text-xs font-bold rounded-lg px-2 py-1.5 focus:outline-none">
                <option value="ALL">全レア</option>
                <option value="SSR">SSR</option>
                <option value="SR">SR</option>
                <option value="R">R</option>
              </select>

              <input type="text" id="searchInput" placeholder="英雄名検索..." class="w-28 sm:w-32 bg-[#1e293b] border border-[#2a6ea6]/60 text-white placeholder-slate-400 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-sky-400" />
            </div>
          </div>
        </section>

        <!-- 英雄プールエリア -->
        <section class="bg-[#161b26] border border-[#2a6ea6] rounded-xl p-2 sm:p-3 flex-1 min-h-[260px] max-h-[52vh] lg:max-h-none overflow-y-auto shadow-inner">
          <div id="heroPoolGrid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-5 xl:grid-cols-6 gap-1.5 sm:gap-2"></div>
          <div id="emptyPoolMsg" class="hidden text-center py-10 text-slate-400 text-sm">
            条件に一致する英雄が見つかりません。
          </div>
        </section>
      </div>
    </div>

  </main>

  <!-- モーダル1：名称編集 -->
  <div id="renameModal" class="fixed inset-0 z-50 bg-black/75 hidden items-center justify-center p-4">
    <div class="bg-[#1a202c] border border-[#2a6ea6] rounded-xl max-w-sm w-full p-4 shadow-2xl">
      <h3 id="renameModalTitle" class="text-base font-bold text-sky-200 mb-3">名称の編集</h3>
      <input type="text" id="renameInput" maxlength="20" class="w-full bg-[#12161f] border border-[#2a6ea6] rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:border-sky-400 mb-4" />
      <div class="flex justify-end gap-2">
        <button id="cancelRenameBtn" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs font-bold text-slate-200">キャンセル</button>
        <button id="saveRenameBtn" class="px-4 py-1.5 rounded-lg bg-[#2574b5] hover:bg-[#3b82f6] text-xs font-bold text-white">保存</button>
      </div>
    </div>
  </div>

  <!-- モーダル2：新規英雄追加 -->
  <div id="customHeroModal" class="fixed inset-0 z-50 bg-black/75 hidden items-center justify-center p-4">
    <div class="bg-[#1a202c] border border-[#2a6ea6] rounded-xl max-w-md w-full p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-bold text-amber-300">✨ 新規英雄・画像登録</h3>
        <button id="closeCustomHeroModalBtn" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>
      <form id="customHeroForm" class="flex flex-col gap-3 text-xs">
        <div>
          <label class="block text-slate-300 font-bold mb-1">英雄名 <span class="text-rose-400">*</span></label>
          <input type="text" id="customHeroName" required maxlength="14" placeholder="例: ジェシー / 新英雄" class="w-full bg-[#12161f] border border-[#2a6ea6] rounded-lg px-3 py-2 text-white focus:outline-none" />
        </div>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-slate-300 font-bold mb-1">兵種</label>
            <select id="customHeroType" class="w-full bg-[#12161f] border border-[#2a6ea6] rounded-lg px-2 py-2 text-white">
              <option value="shield">🛡️ 盾兵</option>
              <option value="spear">🔱 槍兵</option>
              <option value="bow">🏹 弓兵</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 font-bold mb-1">世代</label>
            <select id="customHeroGen" class="w-full bg-[#12161f] border border-[#2a6ea6] rounded-lg px-2 py-2 text-white">
              <option value="G7">G7</option>
              <option value="G6">G6</option>
              <option value="G5">G5</option>
              <option value="G4">G4</option>
              <option value="G3">G3</option>
              <option value="G2">G2</option>
              <option value="G1">G1</option>
              <option value="G8">G8</option>
              <option value="G9">G9</option>
              <option value="CUSTOM" selected>CUSTOM</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 font-bold mb-1">レア</label>
            <select id="customHeroRarity" class="w-full bg-[#12161f] border border-[#2a6ea6] rounded-lg px-2 py-2 text-white">
              <option value="SSR" selected>SSR</option>
              <option value="SR">SR</option>
              <option value="R">R</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-slate-300 font-bold mb-1">アイコン画像（任意・自動リサイズ保存）</label>
          <input type="file" id="customHeroImageInput" accept="image/*" class="w-full text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-[#2574b5] file:text-white cursor-pointer" />
        </div>
        <div class="flex justify-end gap-2 mt-2">
          <button type="button" id="cancelCustomHeroBtn" class="px-3 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 font-bold text-slate-200">キャンセル</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 font-bold text-white shadow">登録する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- モーダル3：全英雄の個別編集・写真設定・削除モーダル -->
  <div id="editHeroModal" class="fixed inset-0 z-50 bg-black/75 hidden items-center justify-center p-4">
    <div class="bg-[#1a202c] border border-[#2a6ea6] rounded-xl max-w-md w-full p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-base font-bold text-sky-300">✏️ 英雄の編集・写真設定・削除</h3>
        <button id="closeEditHeroModalBtn" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
      </div>

      <form id="editHeroForm" class="flex flex-col gap-3 text-xs">
        <input type="hidden" id="editHeroId" />

        <div class="flex items-center gap-3 bg-[#12161f] p-3 rounded-lg border border-[#2a6ea6]/60">
          <div id="editHeroPreviewBox" class="w-16 h-16 rounded-lg overflow-hidden border-2 border-amber-400 shrink-0 flex items-center justify-center bg-slate-800"></div>
          <div class="flex-1 flex flex-col gap-1.5">
            <label class="block text-slate-200 font-bold">アイコン写真を設定・変更</label>
            <input type="file" id="editHeroImageInput" accept="image/*" class="w-full text-[11px] text-slate-300 file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-xs file:font-bold file:bg-[#2574b5] file:text-white cursor-pointer" />
            <button type="button" id="clearEditHeroImageBtn" class="self-start text-[11px] text-rose-400 hover:text-rose-300 underline">設定中の写真をクリア</button>
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-bold mb-1">英雄名</label>
          <input type="text" id="editHeroName" required maxlength="14" class="w-full bg-[#12161f] border border-[#2a6ea6] rounded-lg px-3 py-2 text-white focus:outline-none" />
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-slate-300 font-bold mb-1">兵種</label>
            <select id="editHeroType" class="w-full bg-[#12161f] border border-[#2a6ea6] rounded-lg px-2 py-2 text-white">
              <option value="shield">🛡️ 盾兵</option>
              <option value="spear">🔱 槍兵</option>
              <option value="bow">🏹 弓兵</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 font-bold mb-1">世代</label>
            <select id="editHeroGen" class="w-full bg-[#12161f] border border-[#2a6ea6] rounded-lg px-2 py-2 text-white">
              <option value="G1">G1</option>
              <option value="G2">G2</option>
              <option value="G3">G3</option>
              <option value="G4">G4</option>
              <option value="G5">G5</option>
              <option value="G6">G6</option>
              <option value="G7">G7</option>
              <option value="G8">G8</option>
              <option value="G9">G9</option>
              <option value="CUSTOM">CUSTOM</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 font-bold mb-1">レア</label>
            <select id="editHeroRarity" class="w-full bg-[#12161f] border border-[#2a6ea6] rounded-lg px-2 py-2 text-white">
              <option value="SSR">SSR</option>
              <option value="SR">SR</option>
              <option value="R">R</option>
            </select>
          </div>

        <div class="flex items-center justify-between gap-2 mt-3 pt-3 border-t border-slate-700">
          <button type="button" id="deleteSingleHeroBtn" class="px-3 py-2 rounded-lg bg-rose-700 hover:bg-rose-600 font-bold text-white">
            🗑️ このキャラを削除
          </button>
          <div class="flex gap-2">
            <button type="button" id="cancelEditHeroBtn" class="px-3 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 font-bold text-slate-200">キャンセル</button>
            <button type="submit" class="px-4 py-2 rounded-lg bg-[#2574b5] hover:bg-[#3b82f6] font-bold text-white shadow">変更を保存</button>

      </form>

  </div>

  <!-- モーダル4：確認ダイアログ -->
  <div id="confirmModal" class="fixed inset-0 z-50 bg-black/75 hidden items-center justify-center p-4">
    <div class="bg-[#1a202c] border border-[#2a6ea6] rounded-xl max-w-sm w-full p-4 shadow-2xl">
      <h3 class="text-base font-bold text-amber-300 mb-2">確認</h3>
      <p id="confirmMessage" class="text-xs sm:text-sm text-slate-200 mb-4"></p>
      <div class="flex justify-end gap-2">
        <button id="cancelConfirmBtn" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs font-bold text-slate-200">キャンセル</button>
        <button id="okConfirmBtn" class="px-4 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-xs font-bold text-white">実行</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_HEROES = [
      // G9
      { id: 'g9_magnus', name: 'マグナス', type: 'shield', gen: 'G9', rarity: 'SSR' },
      { id: 'g9_fred',   name: 'フレッド', type: 'spear',  gen: 'G9', rarity: 'SSR' },
      { id: 'g9_zura',   name: 'ズーラ',   type: 'bow',    gen: 'G9', rarity: 'SSR' },
      // G8
      { id: 'g8_gato',     name: 'ガト',         type: 'shield', gen: 'G8', rarity: 'SSR' },
      { id: 'g8_sonia',    name: 'ソニア',       type: 'spear',  gen: 'G8', rarity: 'SSR' },
      { id: 'g8_hendrick', name: 'ヘンドリック', type: 'bow',    gen: 'G8', rarity: 'SSR' },
      // G7
      { id: 'g7_edith',   name: 'エディス',     type: 'shield', gen: 'G7', rarity: 'SSR' },
      { id: 'g7_gordon',  name: 'ゴードン',     type: 'spear',  gen: 'G7', rarity: 'SSR' },
      { id: 'g7_bradley', name: 'ブラッドリー', type: 'bow',    gen: 'G7', rarity: 'SSR' },
      // G6
      { id: 'g6_wuman', name: 'ウーマン', type: 'shield', gen: 'G6', rarity: 'SSR' },
      { id: 'g6_rene',  name: 'レネ',     type: 'spear',  gen: 'G6', rarity: 'SSR' },
      { id: 'g6_wayne', name: 'ウェイン', type: 'bow',    gen: 'G6', rarity: 'SSR' },
      // G5
      { id: 'g5_hector', name: 'ヘクター', type: 'shield', gen: 'G5', rarity: 'SSR' },
      { id: 'g5_nora',   name: 'ノラ',     type: 'spear',  gen: 'G5', rarity: 'SSR' },
      { id: 'g5_gwen',   name: 'グウェン', type: 'bow',    gen: 'G5', rarity: 'SSR' },
      // G4
      { id: 'g4_ahmos', name: 'アクモス', type: 'shield', gen: 'G4', rarity: 'SSR' },
      { id: 'g4_reina', name: 'レイナ',   type: 'spear',  gen: 'G4', rarity: 'SSR' },
      { id: 'g4_lynn',  name: 'リューク', type: 'bow',    gen: 'G4', rarity: 'SSR' },
      // G3
      { id: 'g3_logan', name: 'ローガン', type: 'shield', gen: 'G3', rarity: 'SSR' },
      { id: 'g3_mia',   name: 'ミア',     type: 'spear',  gen: 'G3', rarity: 'SSR' },
      { id: 'g3_greg',  name: 'グレッグ', type: 'bow',    gen: 'G3', rarity: 'SSR' },
      // G2
      { id: 'g2_flint',  name: 'フリント', type: 'shield', gen: 'G2', rarity: 'SSR' },
      { id: 'g2_philly', name: 'フィリ',   type: 'spear',  gen: 'G2', rarity: 'SSR' },
      { id: 'g2_alonso', name: 'アロンゾ', type: 'bow',    gen: 'G2', rarity: 'SSR' },
      // G1 SSR
      { id: 'g1_jeronimo', name: 'ジェロニモ', type: 'shield', gen: 'G1', rarity: 'SSR' },
      { id: 'g1_natalia',  name: 'ナタリア',   type: 'shield', gen: 'G1', rarity: 'SSR' },
      { id: 'g1_molly',    name: 'モリー',     type: 'spear',  gen: 'G1', rarity: 'SSR' },
      { id: 'g1_zinman',   name: 'ジンマン',   type: 'bow',    gen: 'G1', rarity: 'SSR' },
      // G1 SR
      { id: 'g1_sergey',  name: 'セルゲイ',   type: 'shield', gen: 'G1', rarity: 'SR' },
      { id: 'g1_jasser',  name: 'ジャスミン', type: 'spear',  gen: 'G1', rarity: 'SR' },
      { id: 'g1_patrick', name: 'パトリック', type: 'spear',  gen: 'G1', rarity: 'SR' },
      { id: 'g1_bahiti',  name: 'バシティ',   type: 'bow',    gen: 'G1', rarity: 'SR' },
      { id: 'g1_gina',    name: 'ジーナ',     type: 'bow',    gen: 'G1', rarity: 'SR' },
      // G1 R
      { id: 'g1_charlie', name: 'チャーリー', type: 'shield', gen: 'G1', rarity: 'R' },
      { id: 'g1_cloris',  name: 'クラーク',   type: 'spear',  gen: 'G1', rarity: 'R' },
      { id: 'g1_smith',   name: 'スミス',     type: 'spear',  gen: 'G1', rarity: 'R' },
      { id: 'g1_eugene',  name: 'ユーニス',   type: 'bow',    gen: 'G1', rarity: 'R' }
    ];

    const TROOP_META = {
      shield: { label: '盾兵', icon: '🛡️', color: 'text-sky-300' },
      spear:  { label: '槍兵', icon: '🔱', color: 'text-emerald-300' },
      bow:    { label: '弓兵', icon: '🏹', color: 'text-amber-300' }
    };

    const STORAGE_KEY = 'wos_squad_builder_v2';

    function createDefaultRatio() {
      return { shield: 50, spear: 20, bow: 30 };
    }

    function createInitialPresets() {
      const presets = [];
      for (let i = 1; i <= 6; i++) {
        presets.push({
          id: `preset_${i}`,
          name: `セット${i}`,
          squads: [
            { id: `sq_${i}_1`, name: '部隊1', mode: 'standard', slots: [null, null, null], ratio: createDefaultRatio() },
            { id: `sq_${i}_2`, name: '部隊2', mode: 'standard', slots: [null, null, null], ratio: createDefaultRatio() },
            { id: `sq_${i}_3`, name: '部隊3', mode: 'standard', slots: [null, null, null], ratio: createDefaultRatio() },
            { id: `sq_${i}_4`, name: '部隊4', mode: 'standard', slots: [null, null, null], ratio: createDefaultRatio() },
            { id: `sq_${i}_5`, name: '部隊5', mode: 'standard', slots: [null, null, null], ratio: createDefaultRatio() },
            { id: `sq_${i}_6`, name: '部隊6', mode: 'standard', slots: [null, null, null], ratio: createDefaultRatio() },
            { id: `sq_${i}_cand`, name: '候補', mode: 'free', slots: [null, null, null], ratio: createDefaultRatio() }
          ]
        });
      }
      return presets;
    }

    let state = {
      presets: createInitialPresets(),
      currentPresetIndex: 0,
      allowDuplicate: false,
      customHeroes: [],
      heroOverrides: {}, // 初期英雄の写真・名前上書きデータ
      deletedHeroIds: [], // 削除済みの初期英雄IDリスト
      maxGen: 7, // 初期表示上限をG7に設定
      marchSettings: {
        baseCapacity: 150000,
        gemBuff: 0, // 0, 10, 20
        petBuff: 0, // %
        totalTroops: { shield: 0, spear: 0, bow: 0 }
      },
      filters: { type: 'ALL', gen: 'ALL', rarity: 'ALL', search: '' },
      selectedSlot: null
    };

    let editingHeroTempImage = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('wos_squad_builder_v1');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.presets) && parsed.presets.length > 0) {
            state.presets = parsed.presets;
            // 既存データにratioがない場合の補完
            state.presets.forEach(p => {
              p.squads.forEach(sq => {
                if (!sq.ratio) sq.ratio = createDefaultRatio();
              });
            });
          }
          if (typeof parsed.currentPresetIndex === 'number') state.currentPresetIndex = Math.min(parsed.currentPresetIndex, state.presets.length - 1);
          if (typeof parsed.allowDuplicate === 'boolean') state.allowDuplicate = parsed.allowDuplicate;
          if (Array.isArray(parsed.customHeroes)) state.customHeroes = parsed.customHeroes;
          if (parsed.heroOverrides && typeof parsed.heroOverrides === 'object') state.heroOverrides = parsed.heroOverrides;
          if (Array.isArray(parsed.deletedHeroIds)) state.deletedHeroIds = parsed.deletedHeroIds;
          if (typeof parsed.maxGen === 'number') state.maxGen = parsed.maxGen;
          if (parsed.marchSettings && typeof parsed.marchSettings === 'object') {
            state.marchSettings = {
              ...state.marchSettings,
              ...parsed.marchSettings,
              totalTroops: {
                shield: 0,
                spear: 0,
                bow: 0,
                ...(parsed.marchSettings.totalTroops || {})
              }
            };
          }
        }
      } catch (e) {
        console.error('loadState error:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          presets: state.presets,
          currentPresetIndex: state.currentPresetIndex,
          allowDuplicate: state.allowDuplicate,
          customHeroes: state.customHeroes,
          heroOverrides: state.heroOverrides,
          deletedHeroIds: state.deletedHeroIds,
          maxGen: state.maxGen,
          marchSettings: state.marchSettings
        }));
      } catch (e) {
        showToast('保存容量の上限に達しました。不要な画像を減らしてください。', 'error');
      }
    }

    function getAllHeroes() {
      const deletedSet = new Set(state.deletedHeroIds);
      const activeDefaults = DEFAULT_HEROES
        .filter(h => !deletedSet.has(h.id))
        .map(h => state.heroOverrides[h.id] ? { ...h, ...state.heroOverrides[h.id] } : h);
      return [...state.customHeroes, ...activeDefaults];
    }

    function getHeroById(id) {
      return getAllHeroes().find(h => h.id === id) || null;
    }

    function getCurrentPreset() {
      return state.presets[state.currentPresetIndex];
    }

    function getAssignedHeroIds() {
      const ids = new Set();
      getCurrentPreset().squads.forEach(sq => {
        sq.slots.forEach(heroId => { if (heroId) ids.add(heroId); });
      });
      return ids;
    }

    function getGenNumber(genStr) {
      if (!genStr || genStr === 'CUSTOM') return 0;
      const num = parseInt(genStr.replace('G', ''), 10);
      return isNaN(num) ? 0 : num;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const colors = type === 'error' ? 'bg-rose-600 border-rose-400 text-white'
        : type === 'success' ? 'bg-emerald-600 border-emerald-400 text-white'
        : 'bg-[#2574b5] border-sky-400 text-white';

      toast.className = `${colors} border px-3.5 py-2 rounded-lg shadow-xl text-xs font-bold transition-all duration-200`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    function showConfirm(message, onConfirm) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmMessage').textContent = message;
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const okBtn = document.getElementById('okConfirmBtn');
      const cancelBtn = document.getElementById('cancelConfirmBtn');
      const cleanup = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };
      okBtn.onclick = () => { cleanup(); onConfirm(); };
      cancelBtn.onclick = cleanup;
    }

    function renderHeroCardInner(hero, isPool = false, isAssigned = false) {
      const troop = TROOP_META[hero.type] || TROOP_META.shield;
      const initial = hero.name.slice(0, 2);

      const visualHtml = hero.image
        ? `<img src="${hero.image}" alt="${hero.name}" class="w-full h-full object-cover" />`
        : `<div class="w-full h-full flex items-center justify-center">
             <span class="text-lg sm:text-xl font-black text-white/95 drop-shadow mt-1">${initial}</span>
           </div>`;

      return `
        <div class="relative w-full h-full rounded-lg overflow-hidden border-2 rarity-${hero.rarity} shadow-md flex flex-col justify-between">
          <div class="absolute inset-0">${visualHtml}</div>

          <div class="relative z-10 flex items-center justify-between p-1 pointer-events-none">
            <div class="flex items-center gap-0.5 bg-black/75 rounded px-1 py-0.5 border border-white/15">
              <span class="text-[10px] sm:text-xs leading-none">${troop.icon}</span>
              <span class="text-[9px] sm:text-[10px] font-black text-sky-200 leading-none">${hero.gen === 'CUSTOM' ? 'EX' : hero.gen}</span>
            </div>
            ${!isPool ? `<span class="text-[9px] font-black px-1 rounded bg-black/65 text-amber-300 leading-tight">${hero.rarity}</span>` : ''}
          </div>

          ${isPool && isAssigned && !state.allowDuplicate ? `
            <div class="absolute inset-0 z-10 bg-slate-950/70 flex items-center justify-center pointer-events-none">
              <span class="bg-[#2574b5] text-white text-[10px] font-extrabold px-1.5 py-0.5 rounded border border-sky-300/60 shadow">編成中</span>
            </div>
          ` : ''}

          <div class="relative z-10 bg-gradient-to-t from-black/95 via-black/80 to-transparent pt-2 pb-0.5 px-1 text-center pointer-events-none">
            <div class="text-[10px] sm:text-[11px] font-bold text-white truncate leading-tight drop-shadow">${hero.name}</div>
          </div>
        </div>
      `;
    }

    function renderPresetSelect() {
      const select = document.getElementById('presetSelect');
      select.innerHTML = '';
      state.presets.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = p.name;
        if (idx === state.currentPresetIndex) opt.selected = true;
        select.appendChild(opt);
      });
      document.getElementById('captureTitle').textContent = getCurrentPreset().name;
    }

    function updateActiveSlotIndicator() {
      const indicator = document.getElementById('activeSlotIndicator');
      const preset = getCurrentPreset();
      if (state.selectedSlot && preset.squads[state.selectedSlot.squadIndex]) {
        const sq = preset.squads[state.selectedSlot.squadIndex];
        const slotNames = sq.mode === 'standard' ? ['盾兵枠', '槍兵枠', '弓兵枠'] : ['自由枠1', '自由枠2', '自由枠3'];
        indicator.textContent = `選択中: ${sq.name} - ${slotNames[state.selectedSlot.slotIndex]}`;
        indicator.classList.add('text-amber-300');
      } else {
        indicator.textContent = '選択中: なし';
        indicator.classList.remove('text-amber-300');
      }
    }

    function getEffectiveCapacity() {
      const base = Number(state.marchSettings.baseCapacity) || 0;
      const gem = Number(state.marchSettings.gemBuff) || 0;
      const pet = Number(state.marchSettings.petBuff) || 0;
      return Math.floor(base * (1 + (gem + pet) / 100));
    }

    function renderMarchSettings() {
      document.getElementById('baseCapacityInput').value = state.marchSettings.baseCapacity;
      document.getElementById('gemBuffSelect').value = String(state.marchSettings.gemBuff);
      document.getElementById('petBuffInput').value = state.marchSettings.petBuff;
      const totals = state.marchSettings.totalTroops || { shield: 0, spear: 0, bow: 0 };
      document.getElementById('totalShieldInput').value = totals.shield || '';
      document.getElementById('totalSpearInput').value = totals.spear || '';
      document.getElementById('totalBowInput').value = totals.bow || '';

      const eff = getEffectiveCapacity();
      const totalBuff = (Number(state.marchSettings.gemBuff) || 0) + (Number(state.marchSettings.petBuff) || 0);
      document.getElementById('effectiveCapacityBadge').textContent =
        `実出征: ${eff.toLocaleString()}人${totalBuff > 0 ? ` (+${totalBuff}%)` : ''}`;

      renderTroopBalanceSummary();
    }

    function renderTroopBalanceSummary() {
      const summaryEl = document.getElementById('troopBalanceSummary');
      if (!summaryEl) return;
      const preset = getCurrentPreset();
      const effCap = getEffectiveCapacity();
      const totals = state.marchSettings.totalTroops || { shield: 0, spear: 0, bow: 0 };

      let reqShield = 0, reqSpear = 0, reqBow = 0;
      preset.squads.forEach(sq => {
        // 英雄が1人以上配置されている部隊、または「候補」以外の部隊を対象に集計
        const hasHero = sq.slots.some(id => id !== null);
        if (!hasHero && sq.name.includes('候補')) return;
        const r = sq.ratio || createDefaultRatio();
        reqShield += Math.round(effCap * ((Number(r.shield) || 0) / 100));
        reqSpear += Math.round(effCap * ((Number(r.spear) || 0) / 100));
        reqBow += Math.round(effCap * ((Number(r.bow) || 0) / 100));
      });

      const formatItem = (icon, label, req, owned) => {
        const hasOwned = Number(owned) > 0;
        const diff = (Number(owned) || 0) - req;
        if (!hasOwned) {
          return `<span class="text-slate-300">${icon}必要:${req.toLocaleString()}</span>`;
        }
        if (diff < 0) {
          return `<span class="bg-rose-950/90 border border-rose-500/70 text-rose-300 px-1.5 py-0.5 rounded">${icon}${req.toLocaleString()} <span class="text-rose-400 font-black">(${Math.abs(diff).toLocaleString()}不足!)</span></span>`;
        }
        return `<span class="bg-emerald-950/60 border border-emerald-500/40 text-emerald-300 px-1.5 py-0.5 rounded">${icon}${req.toLocaleString()} <span class="text-[10px] text-emerald-400">(残${diff.toLocaleString()})</span></span>`;
      };

      summaryEl.innerHTML = [
        formatItem('🛡️', '盾', reqShield, totals.shield),
        formatItem('🔱', '槍', reqSpear, totals.spear),
        formatItem('🏹', '弓', reqBow, totals.bow)
      ].join('');
    }

    function renderSquads() {
      const container = document.getElementById('squadsContainer');
      const preset = getCurrentPreset();
      const effCap = getEffectiveCapacity();
      container.innerHTML = '';

      preset.squads.forEach((squad, sqIdx) => {
        if (!squad.ratio) squad.ratio = createDefaultRatio();

        const row = document.createElement('div');
        row.className = 'squad-row-container rounded-lg overflow-hidden flex items-stretch shadow-sm';

        const labelCol = document.createElement('div');
        labelCol.className = 'squad-label-box w-24 sm:w-32 shrink-0 p-2 flex flex-col justify-between text-white border-r border-[#2a6ea6]';

        const nameBtn = document.createElement('button');
        nameBtn.type = 'button';
        nameBtn.className = 'text-left font-extrabold text-xs sm:text-sm hover:text-amber-200 transition truncate';
        nameBtn.textContent = `${squad.name} ✏️`;
        nameBtn.onclick = () => openRenameModal('squad', sqIdx);

        const controlsDiv = document.createElement('div');
        controlsDiv.className = 'flex items-center justify-between gap-1 mt-2 pt-1.5 border-t border-white/20';

        const modeBtn = document.createElement('button');
        modeBtn.type = 'button';
        modeBtn.className = `text-[10px] font-bold px-1.5 py-0.5 rounded transition ${
          squad.mode === 'standard' ? 'bg-slate-900/50 text-sky-100' : 'bg-amber-500 text-slate-950'
        }`;
        modeBtn.textContent = squad.mode === 'standard' ? '盾・槍・弓' : '自由枠';
        modeBtn.onclick = () => {
          squad.mode = squad.mode === 'standard' ? 'free' : 'standard';
          saveState();
          renderSquads();
        };

        const delRowBtn = document.createElement('button');
        delRowBtn.type = 'button';
        delRowBtn.className = 'text-white/80 hover:text-rose-200 text-xs px-1';
        delRowBtn.textContent = '🗑️';
        delRowBtn.onclick = () => {
          if (preset.squads.length <= 1) {
            showToast('最低1つの部隊行が必要です', 'error');
            return;
          }
          preset.squads.splice(sqIdx, 1);
          if (state.selectedSlot && state.selectedSlot.squadIndex === sqIdx) state.selectedSlot = null;
          saveState();
          renderAll();
        };

        controlsDiv.appendChild(modeBtn);
        controlsDiv.appendChild(delRowBtn);
        labelCol.appendChild(nameBtn);
        labelCol.appendChild(controlsDiv);

        // 右側メインエリア（スロット行 ＋ 兵士割合・人数計算行）
        const rightWrapper = document.createElement('div');
        rightWrapper.className = 'flex-1 flex flex-col bg-[#12161f]/60 min-w-0';

        const slotsCol = document.createElement('div');
        slotsCol.className = 'p-1.5 sm:p-2 flex items-center gap-2 sm:gap-3 overflow-x-auto';

        const requiredTypes = ['shield', 'spear', 'bow'];

        squad.slots.forEach((heroId, slotIdx) => {
          const isSelected = state.selectedSlot &&
            state.selectedSlot.squadIndex === sqIdx &&
            state.selectedSlot.slotIndex === slotIdx;

          const reqType = squad.mode === 'standard' ? requiredTypes[slotIdx] : null;
          const troopMeta = reqType ? TROOP_META[reqType] : null;

          const slotEl = document.createElement('div');
          slotEl.className = `relative w-16 h-16 sm:w-20 sm:h-20 shrink-0 rounded-lg border-2 border-dashed transition cursor-pointer flex items-center justify-center ${
            isSelected ? 'slot-active' : 'border-[#2a6ea6]/60 hover:border-sky-400 bg-[#1a202c]/70'
          }`;

          slotEl.ondragover = (e) => { e.preventDefault(); slotEl.classList.add('drag-over'); };
          slotEl.ondragleave = () => slotEl.classList.remove('drag-over');
          slotEl.ondrop = (e) => {
            e.preventDefault();
            slotEl.classList.remove('drag-over');
            const draggedHeroId = e.dataTransfer.getData('text/plain');
            if (draggedHeroId) assignHeroToSlot(sqIdx, slotIdx, draggedHeroId);

        const rSpear = Number(squad.ratio.spear) || 0;
        const rBow = Number(squad.ratio.bow) || 0;
        const sumRatio = rShield + rSpear + rBow;

        const cShield = Math.round(effCap * (rShield / 100));
        const cSpear = Math.round(effCap * (rSpear / 100));
        const cBow = Math.round(effCap * (rBow / 100));

          inp.max = '100';

          inp.className = 'w-9 bg-transparent text-white font-bold text-right focus:outline-none';
          inp.onchange = (e) => {
            squad.ratio[key] = Math.max(0, Math.min(100, Number(e.target.value) || 0));

            renderSquads();

          pct.className = 'text-slate-400 text-[10px]';

        inputsGroup.appendChild(makeRatioInput('spear', '🔱', 'text-emerald-300'));
        inputsGroup.appendChild(makeRatioInput('bow', '🏹', 'text-amber-300'));

        presetBtns.className = 'flex items-center gap-1';

          <span class="text-emerald-300">槍:${cSpear.toLocaleString()}</span>

    function assignHeroToSlot(sqIdx, slotIdx, heroId) {
      const preset = getCurrentPreset();
      const targetSquad = preset.squads[sqIdx];
      const hero = getHeroById(heroId);
      if (!targetSquad || !hero) return;

      if (!state.allowDuplicate) {
        preset.squads.forEach(sq => {
          sq.slots = sq.slots.map(id => (id === heroId ? null : id));
        });
      }

      targetSquad.slots[slotIdx] = heroId;

      let nextSlot = null;
      for (let i = slotIdx + 1; i < targetSquad.slots.length; i++) {
        if (!targetSquad.slots[i]) {
          nextSlot = { squadIndex: sqIdx, slotIndex: i };
          break;
        }
      }
      state.selectedSlot = nextSlot;
      saveState();
      renderAll();
    }

    function updateMaxGenControls() {
      const select = document.getElementById('maxGenFilter');
      select.value = String(state.maxGen);

      const restoreBtn = document.getElementById('restoreHeroesBtn');
      if (state.deletedHeroIds.length > 0) {
        restoreBtn.classList.remove('hidden');
        restoreBtn.classList.add('flex');
      } else {
        restoreBtn.classList.add('hidden');
        restoreBtn.classList.remove('flex');
      }
    }

    function renderHeroPool() {
      const grid = document.getElementById('heroPoolGrid');
      const emptyMsg = document.getElementById('emptyPoolMsg');
      const assignedIds = getAssignedHeroIds();

      const filtered = getAllHeroes().filter(hero => {
        const gNum = getGenNumber(hero.gen);
        if (gNum > 0 && gNum > state.maxGen) return false;
        if (state.filters.type !== 'ALL' && hero.type !== state.filters.type) return false;
        if (state.filters.gen !== 'ALL' && hero.gen !== state.filters.gen) return false;
        if (state.filters.rarity !== 'ALL' && hero.rarity !== state.filters.rarity) return false;
        if (state.filters.search && !hero.name.toLowerCase().includes(state.filters.search.toLowerCase())) return false;
        return true;
      });

      grid.innerHTML = '';
      if (filtered.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      filtered.forEach(hero => {
        const isAssigned = assignedIds.has(hero.id);
        const card = document.createElement('div');
        card.className = `relative aspect-square cursor-pointer transition transform hover:scale-[1.03] active:scale-95 ${
          isAssigned && !state.allowDuplicate ? 'opacity-50' : ''
        }`;
        card.draggable = true;
        card.innerHTML = renderHeroCardInner(hero, true, isAssigned);

        // 右上：編集・写真設定・個別削除ボタン
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.title = `${hero.name}の写真設定・編集・削除`;
        editBtn.className = 'absolute top-1 right-1 z-20 w-5 h-5 sm:w-6 sm:h-6 rounded bg-black/80 hover:bg-[#2574b5] text-white border border-white/30 flex items-center justify-center text-[10px] sm:text-xs shadow';
        editBtn.textContent = '✏️';
        editBtn.onclick = (e) => {
          e.stopPropagation();
          openEditHeroModal(hero.id);
        };
        card.appendChild(editBtn);

        card.ondragstart = (e) => e.dataTransfer.setData('text/plain', hero.id);

        card.onclick = () => {
          const preset = getCurrentPreset();
          if (state.selectedSlot) {
            assignHeroToSlot(state.selectedSlot.squadIndex, state.selectedSlot.slotIndex, hero.id);
            return;
          }

          const typeToSlotIdx = { shield: 0, spear: 1, bow: 2 };
          const preferredIdx = typeToSlotIdx[hero.type];

          for (let sIdx = 0; sIdx < preset.squads.length; sIdx++) {
            const sq = preset.squads[sIdx];
            if (sq.mode === 'standard' && sq.slots[preferredIdx] === null) {
              assignHeroToSlot(sIdx, preferredIdx, hero.id);
              showToast(`${sq.name}の${TROOP_META[hero.type].label}枠に${hero.name}を配置しました`);
              return;
            }
            if (sq.mode === 'free') {
              const emptyFreeIdx = sq.slots.findIndex(x => x === null);
              if (emptyFreeIdx !== -1) {
                assignHeroToSlot(sIdx, emptyFreeIdx, hero.id);
                showToast(`${sq.name}に${hero.name}を配置しました`);
                return;
              }
            }
          }
          showToast('配置できる空き枠がありません。枠をタップして選択してください。');
        };

        grid.appendChild(card);
      });
    }

    function removeHeroCompletely(heroId) {
      state.presets.forEach(p => {
        p.squads.forEach(sq => {
          sq.slots = sq.slots.map(id => (id === heroId ? null : id));
        });
      });

      const customIdx = state.customHeroes.findIndex(h => h.id === heroId);
      if (customIdx !== -1) {
        state.customHeroes.splice(customIdx, 1);
      } else {
        if (!state.deletedHeroIds.includes(heroId)) state.deletedHeroIds.push(heroId);
        delete state.heroOverrides[heroId];
      }
    }

      document.getElementById('editHeroId').value = hero.id;

    function openRenameModal(targetType, squadIndex = null) {
      const modal = document.getElementById('renameModal');

    function resizeImageToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const size = 128;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const minSide = Math.min(img.width, img.height);
            const sx = (img.width - minSide) / 2;
            const sy = (img.height - minSide) / 2;
            ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

        renderHeroPool();

      document.getElementById('copyTextBtn').onclick = () => {
        const preset = getCurrentPreset();
        const effCap = getEffectiveCapacity();
        const totalBuff = (Number(state.marchSettings.gemBuff) || 0) + (Number(state.marchSettings.petBuff) || 0);
        const lines = [
          `【${preset.name}】出征上限: ${effCap.toLocaleString()}人${totalBuff > 0 ? ` (バフ+${totalBuff}%)` : ''}`
        ];
        preset.squads.forEach(sq => {
          const names = sq.slots.map((id, idx) => {
            const h = id ? getHeroById(id) : null;
            if (sq.mode === 'standard') return `${['盾', '槍', '弓'][idx]}:${h ? h.name : '---'}`;
            return h ? h.name : '---';
          });
          const r = sq.ratio || createDefaultRatio();
          const cShield = Math.round(effCap * (r.shield / 100)).toLocaleString();
          const cSpear = Math.round(effCap * (r.spear / 100)).toLocaleString();
          const cBow = Math.round(effCap * (r.bow / 100)).toLocaleString();
          lines.push(`■ ${sq.name}: ${names.join(' / ')}`);
          lines.push(`   割合 ${r.shield}:${r.spear}:${r.bow}% (盾:${cShield} / 槍:${cSpear} / 弓:${cBow})`);
        });

        const textarea = document.createElement('textarea');
        textarea.value = lines.join('\n');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {

        const hero = getHeroById(id);
        if (!hero) return;
        showConfirm(`「${hero.name}」を一覧から削除しますか？`, () => {
          removeHeroCompletely(id);
          saveState();
          closeEditModal();
          renderAll();
          showToast(`「${hero.name}」を削除しました`);
        });
      };
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      initEvents();
      renderAll();
    });
  </script>
</body>
</html>
